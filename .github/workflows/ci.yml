name: Checks and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-check:
    name: python-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest

  web-check:
    name: web-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m traffic_forecasting check-data --site web
      - run: uv run --locked python scripts/check_reproducibility.py

  archive-check:
    name: archive-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --locked --group archive
      - run: uv run --locked --group archive python scripts/research_archive/check_archive.py
      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_relation_pilot.py
          --source docs/research/evidence/0635-0638/manifest.json
          --output .research-archive/ci-0635-0638.json
      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_rctl_pilot.py
          --source docs/research/evidence/0639/manifest.json
          --output .research-archive/ci-0639.json
      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_ablation_pilot.py
          --source docs/research/evidence/0641/manifest.json
          --output .research-archive/ci-0641.json
      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_recommendation_pilot.py
          --source docs/research/evidence/0642/manifest.json
          --output .research-archive/ci-0642.json
      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_initial_pilot.py
          --source docs/research/evidence/0001-0002/manifest.json
          --output .research-archive/ci-0001-0002.json
      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_joint_selection_pilot.py
          --source docs/research/evidence/0633/manifest.json
          --output .research-archive/ci-0633.json
      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_early_risk_history.py
          --source docs/research/evidence/0003-0007/manifest.json
          --output .research-archive/ci-0003-0007.json
      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_finite_sample_history.py
          --source docs/research/evidence/0008-0009/manifest.json
          --output .research-archive/ci-0008-0009.json
      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_population_upc_history.py
          --source docs/research/evidence/0010-0012/manifest.json
          --output .research-archive/ci-0010-0012.json
      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_transfer_identity_history.py
          --source docs/research/evidence/0013-0015/manifest.json
          --output .research-archive/ci-0013-0015.json
      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_temporal_validity_history.py
          --manifest docs/research/evidence/0016-0017/manifest.json
          --output .research-archive/ci-0016-0017.json

      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_spatial_history.py
          --manifest docs/research/evidence/0018-0021/manifest.json
          --output .research-archive/ci-0018-0021.json

      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_identity_target_history.py
          --manifest docs/research/evidence/0019-0021/manifest.json
          --output .research-archive/ci-0019-0021.json

      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_initial_cost_ledger.py
          --manifest docs/research/evidence/0015-0021-costs/manifest.json
          --output .research-archive/ci-initial-costs.json

      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_conditional_pooling_history.py
          --manifest docs/research/evidence/0023-0025-pooling/manifest.json
          --output .research-archive/ci-conditional-pooling.json

      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_recursive_horizon_history.py
          --manifest docs/research/evidence/0024-0025-horizon/manifest.json
          --output .research-archive/ci-recursive-horizon.json

      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_observable_state_history.py
          --manifest docs/research/evidence/0026-0027-observable/manifest.json
          --output .research-archive/ci-observable-states.json

      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_resolution_history.py
          --manifest docs/research/evidence/0029-0032-resolution/manifest.json
          --output .research-archive/ci-resolution.json

      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_frozen_fit_history.py
          --manifest docs/research/evidence/0033-0035-frozen-fit/manifest.json
          --output .research-archive/ci-frozen-fit.json

      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_information_claim_history.py
          --manifest docs/research/evidence/0036-0038-finite-information/manifest.json
          --output .research-archive/ci-information-claims.json

      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_sample_reuse_history.py
          --manifest docs/research/evidence/0039-0040-sample-reuse/manifest.json
          --output .research-archive/ci-sample-reuse.json

      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_cell_harm_history.py
          --manifest docs/research/evidence/0041-0042-cell-harm/manifest.json
          --output .research-archive/ci-cell-harm.json

      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_mae_sampling_history.py
          --manifest docs/research/evidence/0056-0058-mae-sampling/manifest.json
          --output .research-archive/ci-mae-sampling.json

      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_history_grouping_pilot.py
          --manifest docs/research/evidence/0059-0062-history-grouping/manifest.json
          --output .research-archive/ci-history-grouping.json

  deploy:
    name: deploy-pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [python-check, web-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
