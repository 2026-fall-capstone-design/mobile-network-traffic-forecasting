name: Checks and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-check:
    name: python-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest

  web-check:
    name: web-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m traffic_forecasting check-data --site web
      - run: uv run --locked python scripts/check_reproducibility.py

  archive-check:
    name: archive-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --locked --group archive
      - run: uv run --locked --group archive python scripts/research_archive/check_archive.py
      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_relation_pilot.py
          --source docs/research/evidence/0635-0638/manifest.json
          --output .research-archive/ci-0635-0638.json
      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_rctl_pilot.py
          --source docs/research/evidence/0639/manifest.json
          --output .research-archive/ci-0639.json
      - run: >-
          uv run --locked --group archive python scripts/research_archive/verify_ablation_pilot.py
          --source docs/research/evidence/0641/manifest.json
          --output .research-archive/ci-0641.json

  deploy:
    name: deploy-pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [python-check, web-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
