name: 작업 / 기능 제안
description: 새로운 기능, 개선, 문서 및 환경 설정 작업을 정리합니다.
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        한 이슈에는 함께 완료할 수 있는 작업을 담아 주세요.
        담당자는 오른쪽 Assignees에서 지정하고, 일정이 정해졌다면 Milestone을 선택해 주세요.
  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      multiple: true
      options:
        - 데이터 수집 / 전처리
        - 예측 모델 / 평가
        - 시각화 / UI
        - 결과 데이터 / 배포
        - 문서 / 발표
        - 개발 환경 / 기타
    validations:
      required: false
  - type: textarea
    id: goal
    attributes:
      label: 배경과 목표
      description: 어떤 문제를 해결하며, 완료 후 무엇이 달라지나요?
      placeholder: 시간대별 예측값과 실제값을 비교할 수 있도록 그래프를 추가합니다.
    validations:
      required: false
  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 진행 상황을 확인할 수 있도록 체크리스트로 작성해 주세요.
      placeholder: |
        - [ ] 필요한 데이터와 입력 형식 확인
        - [ ] 기능 구현
        - [ ] 동작 확인 및 문서 반영
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 팀원이 확인할 수 있는 구체적인 결과를 적어 주세요.
      placeholder: 선택한 기간의 예측값과 실제값이 같은 시간축에 표시된다.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: 관련 자료 / 선행 작업
      description: 관련 이슈, 문서, 디자인 또는 먼저 완료되어야 할 작업을 적어 주세요. 없으면 비워 두세요.
      placeholder: "선행 작업: #이슈번호 / 참고 자료 링크"
