name: 모델 실험 / 분석
description: 데이터 분석, 예측 모델 비교 및 성능 개선 실험을 기록합니다.
title: "[Experiment] "
body:
  - type: markdown
    attributes:
      value: |
        실험 전에는 계획을 작성하고, 실험 후에는 결과와 다음 작업을 보완해 주세요.
        담당자는 오른쪽 Assignees에서 지정해 주세요.
  - type: textarea
    id: hypothesis
    attributes:
      label: 실험 목적 / 가설
      description: 무엇을 비교하거나 확인하려고 하나요?
      placeholder: 입력 이력 길이를 변경했을 때 TabICLv2의 트래픽 예측 오차가 줄어드는지 비교합니다.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: 데이터와 평가 구간
      description: 데이터 출처·버전, 대상 지역·기간, 전처리 및 시간 순서에 따른 분할 기준을 적어 주세요.
      placeholder: |
        - 데이터 출처 / 버전 / 대상:
        - 집계 간격 / 결측치 처리:
        - 학습 또는 컨텍스트 / 검증 / 테스트 기간:
        - 미래 정보가 입력이나 전처리에 포함되지 않도록 확인할 사항:
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: 실험 설정과 비교 방법
      description: 재현과 공정한 비교에 필요한 설정을 적어 주세요. 해당하지 않는 항목은 생략해도 됩니다.
      placeholder: |
        - 비교 모델 / 기준 모델:
        - 입력 이력 길이 / 예측 구간:
        - 모델 버전 / 변경할 설정 / 고정할 설정:
        - 평가 지표 및 집계 방식 (예: MAE, RMSE):
        - 실행 명령 또는 노트북 / 설정 파일:
        - 랜덤 시드 / 실행 환경:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 성능이 개선되지 않더라도 실험을 완료했다고 판단할 기준을 적어 주세요.
      placeholder: 동일한 테스트 구간에서 기준 모델과 비교하고, 지표·실행 시간·해석을 기록한다.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: 결과 / 해석 / 후속 작업
      description: 실험 후 이 이슈를 수정하거나 댓글로 결과를 남겨 주세요. 등록 시에는 비워 두어도 됩니다.
      placeholder: |
        - 결과 표 / 그래프 / 산출물 링크:
        - 가설에 대한 결론과 한계:
        - 후속 작업 또는 관련 PR:
