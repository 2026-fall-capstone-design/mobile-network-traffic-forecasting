name: 모델 실험 / 분석
description: 데이터 분석, 예측 모델 비교 및 성능 개선 실험을 기록합니다.
title: "[Experiment] "
body:
  - type: markdown
    attributes:
      value: |
        실험 전에는 계획을 작성하고, 실험 후에는 결과와 다음 작업을 보완해 주세요.
        담당자는 오른쪽 Assignees에서 지정해 주세요.
  - type: textarea
    id: hypothesis
    attributes:
      label: 실험 목적 / 가설
      description: 무엇을 비교하거나 확인하려고 하나요?
      placeholder: 같은 데이터와 평가 조건에서 입력 이력 길이에 따른 트래픽 예측 오차와 실행 비용을 비교합니다.
    validations:
      required: false
  - type: textarea
    id: prior_work
    attributes:
      label: 관련 과거 시도와 이번 실험의 차이
      description: docs/research/prior-attempts.md와 관련 기록을 확인해 주세요. 아카이브는 정리 중이므로 검색 결과가 없다는 사실만으로 과거 시도가 없다고 판단하지 않습니다.
      placeholder: |
        - 관련 기록 / 기존 실험 링크:
        - 같게 유지할 조건과 달라지는 질문 / 조건:
        - 재사용할 예측값 / 설정 / 로그:
        - 기존 실패나 한계를 다시 검토할 이유:
    validations:
      required: false
  - type: textarea
    id: data
    attributes:
      label: 데이터와 평가 구간
      description: 데이터 출처·버전, 대상 지역·기간, 전처리 및 시간 순서에 따른 분할 기준을 적어 주세요.
      placeholder: |
        - 데이터 출처 / 버전 / 대상:
        - 집계 간격 / 결측치 처리:
        - 학습 또는 컨텍스트 / 검증 / 테스트 기간:
        - 예측 시각 / horizon / 입력·정답의 실제 관측 가능 시각:
        - 실제 정답 지연과 평가용 정답 감춤의 구분 (관련 시 원94 확인):
        - 미래 정보가 입력이나 전처리에 포함되지 않도록 확인할 사항:
    validations:
      required: false
  - type: textarea
    id: setup
    attributes:
      label: 실험 설정과 비교 방법
      description: 재현과 공정한 비교에 필요한 설정을 적어 주세요. 해당하지 않는 항목은 생략해도 됩니다.
      placeholder: |
        - 비교 모델 / 기준 모델:
        - 입력 이력 길이 / 예측 구간:
        - 모델 버전 / 변경할 설정 / 고정할 설정:
        - 평가 지표 및 집계 방식 (예: MAE, RMSE):
        - 실행 명령 또는 노트북 / 설정 파일:
        - 랜덤 시드 / 실행 환경:
        - 시각 이동 / 원형 좌표 일관성 / 세 이동 공통 mask / 선택자·평가자 / 후속 원112 판단 (원110–111):
        - 이동 선택·평가 예측기 분리 / 방향·target query 중복 / 기간별 가중치 / 첫 예측 기준 실패와 비용 (원112):
        - 학습 경로 / strict best·patience / 공통 epoch / online train·eval 구분 / 기존 결과 재사용 (원109):
        - 고정 가중치 / BN 통계 출처·분산 식 / 개발14일과 독립평가 / 개선 cell·day / optimizer와 상태적합 비용 (원108):
        - 자기 시간자료 개수 / density own·external·group 분모 / 훈련 query와 이후 평가 / PCC·zero·반대 cell 근거 (원107):
        - 같은 K·sample 수와 자료 구성·실제 epoch의 차이 / 평균·cell·시간 손해 / 최소 원인 판별 비교 (원106):
        - 과거 차단의 근거 공백 / 새 독립 경로 / 이전 비용·실패 보존 / 고정 후속검사 (원105):
        - 과거 상한 제안 / 실제 승인·사용량 / 새 후보·판별 계획의 차이 (원104):
        - 현재근거/완료조건과 새후보의 차이: 직접예측·소속결정·최종RCTL·전체비용·미승인제안 (원103):
        - 후보고정 전 근거 / 같은K·정보·비교군 / 개발기간·cell별손해 / seed별 중단조건:
        - 구조 kernel 대리값: 초기화·폭·readout·손실/optimizer·BN·validation의 대응과 재검토 차이 (원102):
        - target 공동분포·lag 조건화 / 소속·규제값의 target 적응 선택 / 기존 기준 대비 결정·전체 비용 근거:
        - 실제 pooled context / 입력표현16열·8×9 / validation 사용 / 사후·독립평가 (원101):
        - rolling 실측lag·재귀horizon / 초기·predict 스레드 / 저장예측 재사용·새실행 / 기간·cell별예외:
        - 묶는 객체 / 사전학습 정답 / 자동K1·점유labels / 최종 learner 학습 관계 (원100):
        - 달력 정보 / prototype 수·top-k / 전체 준비·후보 계산 비용:
        - 학습 단위 / 한 sample·출력 / 동일K·용량·sample·epoch 조건 (원99):
        - 감소할 비용: 저장량·update·예측 row·호출·Tab 준비/검색 및 전체 측정 범위:
        - 공유 목적 / 목표 분위수 / cell 비중·개별 손해 (관련 시 원98 확인):
        - 밀도 정확성 / learner 정보·의존 조건 / 재추정·전체 비용의 차이:
        - 예측 재사용 주기 / 위상 / 관측 유지 여부 (관련 시 원97 확인):
        - 시간 인과성 / persistence·global 선택 계산 / 실제 latency 비교 (재사용 검토 시):
        - 학습 공유/병합 방식 및 소속 확정 시점 (관련 시 원86·96 확인):
        - 공통 초기화 / BN 상태 처리 / union-data 비교군 (병합 검토 시):
        - 시점당 예측 행 / 모델 호출 수 / batch 구성 (비용 비교 시 원95 확인):
        - 실행시간에 포함·제외한 준비 / 로딩 / warm-up / 결과 수집 범위:
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 성능이 개선되지 않더라도 실험을 완료했다고 판단할 기준을 적어 주세요.
      placeholder: 동일한 테스트 구간에서 기준 모델과 비교하고, 지표·실행 시간·해석을 기록한다.
    validations:
      required: false
  - type: textarea
    id: results
    attributes:
      label: 결과 / 해석 / 후속 작업
      description: 실험 후 이 이슈를 수정하거나 댓글로 결과를 남겨 주세요. 등록 시에는 비워 두어도 됩니다.
      placeholder: |
        - 결과 표 / 그래프 / 산출물 링크:
        - 가설에 대한 결론과 한계:
        - 평균 결과와 기간별 / 셀별 손해:
        - 새 실행과 저장 결과 재분석의 구분:
        - 후속 작업 또는 관련 PR:
